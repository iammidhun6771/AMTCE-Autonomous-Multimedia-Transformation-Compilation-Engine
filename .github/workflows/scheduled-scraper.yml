name: AMTCE Scheduled Scraper

on:
  # Trigger on commit push to main branch
  push:
    branches: [ main ]

  # Run every 6 hours (UTC)
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      target_accounts:
        description: 'Target account handles (comma-separated, max 2)'
        required: false
        default: ''
      platform:
        description: 'Platform to scrape'
        required: true
        type: choice
        options:
          - instagram
          - youtube
          - tiktok

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-scraper:
    name: Run Scraper Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Environment & Credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PUBLIC_GROUP_ID: ${{ secrets.TELEGRAM_PUBLIC_GROUP_ID }}
          TELEGRAM_STORAGE_GROUP_ID: ${{ secrets.TELEGRAM_STORAGE_GROUP_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_BUSINESS_TOKEN: ${{ secrets.IG_BUSINESS_TOKEN }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          # Write environment variables to .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "APIFY_API_TOKEN=$APIFY_API_TOKEN" >> .env
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
          echo "TELEGRAM_PUBLIC_GROUP_ID=$TELEGRAM_PUBLIC_GROUP_ID" >> .env
          echo "TELEGRAM_STORAGE_GROUP_ID=$TELEGRAM_STORAGE_GROUP_ID" >> .env
          echo "META_PAGE_ID=$META_PAGE_ID" >> .env
          echo "META_PAGE_TOKEN=$META_PAGE_TOKEN" >> .env
          echo "IG_BUSINESS_ID=$IG_BUSINESS_ID" >> .env
          echo "IG_BUSINESS_ACCOUNT_ID=$IG_BUSINESS_ID" >> .env
          echo "IG_BUSINESS_TOKEN=$IG_BUSINESS_TOKEN" >> .env
          echo "CLIENT_SECRET_FILE=Credentials/youtube/client_secret.json" >> .env
          echo "YOUTUBE_TOKEN_FILE=Credentials/youtube/token.json" >> .env

          # Create directories and write JSON credential files safely
          mkdir -p Credentials/youtube
          mkdir -p Credentials/social_media/General_Fallback
          mkdir -p cache/face_cache
          mkdir -p downloads

          if [ -n "$CLIENT_SECRET_JSON" ]; then
            echo "$CLIENT_SECRET_JSON" > Credentials/youtube/client_secret.json
          fi
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > Credentials/youtube/token.json
            echo "$TOKEN_JSON" > Credentials/token.json
          fi

      - name: Run Scraper Pipeline
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.target_accounts }}" ]; then
            python main.py --mode auto --target-accounts "${{ github.event.inputs.target_accounts }}" --platform "${{ github.event.inputs.platform }}"
          else
            python main.py --mode auto
          fi

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "No TELEGRAM_BOT_TOKEN set, skipping notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" == "success" ]; then
            MSG="✅ AMTCE Scraper completed successfully"
          elif [ "$STATUS" == "failure" ]; then
            MSG="❌ AMTCE Scraper failed"
          else
            MSG="⚠️ AMTCE Scraper cancelled"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}%0AView: ${RUN_URL}"
