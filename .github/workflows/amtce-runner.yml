name: AMTCE Runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (auto = 6h daemon scheduler, manual = targeted run)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - manual
      platform:
        description: 'Target platform to scrape'
        required: false
        default: 'all_available'
        type: choice
        options:
          - all_available
          - instagram
          - youtube
          - tiktok
      target_accounts:
        description: 'Target creator handle(s) (comma-separated, e.g. indiancelebspot)'
        required: false
        default: ''
        type: string
      target_url:
        description: 'Source video URL to process (YouTube, TikTok, Instagram, direct link)'
        required: false
        default: ''
        type: string

  schedule:
    # 4 clean 6-hour windows aligned with Indian peak human attention (UTC crons):
    - cron: '30 1 * * *'   # 07:00 AM IST — 1hr before 8 AM morning peak window
    - cron: '30 7 * * *'   # 01:00 PM IST — 1hr before 2 PM lunch peak window
    - cron: '30 13 * * *'  # 07:00 PM IST — 1hr before 8 PM prime evening surge
    - cron: '30 19 * * *'  # 01:00 AM IST — 1hr before 2 AM late night attention window

# ── Concurrency Control ──────────────────────────────────────────────────────
# All runs share a single concurrency group.
# cancel-in-progress: false — A running 6-hour session will NEVER be killed
# by a new scheduled cron or manual dispatch. GitHub queues them safely.
concurrency:
  group: amtce-bot
  cancel-in-progress: false

jobs:
  run-amtce:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Kolkata"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_CRON: ${{ github.event.schedule }}
      DISPATCH_MODE: ${{ github.event.inputs.mode || 'both' }}
    timeout-minutes: 360   # 6-hour hard ceiling — GitHub kills gracefully after this
    permissions:
      contents: write
      actions: write

    steps:

    # ── 1. Checkout ───────────────────────────────────────────────────────────
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    # ── 2. Python ─────────────────────────────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # ── 3. System Dependencies ────────────────────────────────────────────────
    - name: Install System Dependencies
      run: |
        which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)

    # ── 4. Python Dependencies ────────────────────────────────────────────────
    # No separate PyTorch step needed:
    # - faster-whisper runs on device="cpu" via ctranslate2 (bundled) — no torch
    # - torch/torchvision are NOT in requirements.txt and NOT imported anywhere
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary -r requirements.txt

    # ── 5. Credential Injection ───────────────────────────────────────────────
    - name: Setup Environment Variables & Tokens
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        TELEGRAM_CONFIG_JSON: ${{ secrets.TELEGRAM_CONFIG_JSON }}
        # General Fallback IG
        META_CONFIG_GENERAL_FALLBACK: ${{ secrets.META_CONFIG_JSON }}
        META_CONFIG_JSON_01:          ${{ secrets.META_CONFIG_JSON_01 }}
        META_CONFIG_JSON_02:          ${{ secrets.META_CONFIG_JSON_02 }}
        META_CONFIG_JSON_03:          ${{ secrets.META_CONFIG_JSON_03 }}
        META_CONFIG_JSON_04:          ${{ secrets.META_CONFIG_JSON_04 }}
        # Fashion IG
        META_CONFIG_JSON_FASHION:     ${{ secrets.META_CONFIG_JSON_FASHION }}
        META_CONFIG_JSON_FASHION_01:  ${{ secrets.META_CONFIG_JSON_FASHION_01 }}
        META_CONFIG_JSON_FASHION_02:  ${{ secrets.META_CONFIG_JSON_FASHION_02 }}
        META_CONFIG_JSON_FASHION_03:  ${{ secrets.META_CONFIG_JSON_FASHION_03 }}
        META_CONFIG_JSON_FASHION_04:  ${{ secrets.META_CONFIG_JSON_FASHION_04 }}
        # Fashion YT OAuth
        CLIENT_SECRET_JSON:           ${{ secrets.CLIENT_SECRET_JSON }}
        TOKEN_JSON:                   ${{ secrets.TOKEN_JSON }}
        CLIENT_SECRET_JSON_01:        ${{ secrets.CLIENT_SECRET_JSON_01 }}
        TOKEN_JSON_01:                ${{ secrets.TOKEN_JSON_01 }}
        CLIENT_SECRET_JSON_02:        ${{ secrets.CLIENT_SECRET_JSON_02 }}
        TOKEN_JSON_02:                ${{ secrets.TOKEN_JSON_02 }}
        # NSFW IG
        META_CONFIG_JSON_NSFW:        ${{ secrets.META_CONFIG_JSON_NSFW }}
        META_CONFIG_JSON_NSFW_01:     ${{ secrets.META_CONFIG_JSON_NSFW_01 }}
        META_CONFIG_JSON_NSFW_02:     ${{ secrets.META_CONFIG_JSON_NSFW_02 }}
        META_CONFIG_JSON_NSFW_03:     ${{ secrets.META_CONFIG_JSON_NSFW_03 }}
        # NSFW YT OAuth
        CLIENT_SECRET_JSON_ADULT:     ${{ secrets.CLIENT_SECRET_JSON_ADULT }}
        TOKEN_JSON_ADULT:             ${{ secrets.TOKEN_JSON_ADULT }}
        CLIENT_SECRET_JSON_ADULT_01:  ${{ secrets.CLIENT_SECRET_JSON_ADULT_01 }}
        TOKEN_JSON_ADULT_01:          ${{ secrets.TOKEN_JSON_ADULT_01 }}
        CLIENT_SECRET_JSON_ADULT_02:  ${{ secrets.CLIENT_SECRET_JSON_ADULT_02 }}
        TOKEN_JSON_ADULT_02:          ${{ secrets.TOKEN_JSON_ADULT_02 }}
        # Paparazzi IG
        META_CONFIG_JSON_PAPARAZZI:    ${{ secrets.META_CONFIG_JSON_PAPARAZZI }}
        META_CONFIG_JSON_PAPARAZZI_01: ${{ secrets.META_CONFIG_JSON_PAPARAZZI_01 }}
        META_CONFIG_JSON_PAPARAZZI_02: ${{ secrets.META_CONFIG_JSON_PAPARAZZI_02 }}
        META_CONFIG_JSON_PAPARAZZI_03: ${{ secrets.META_CONFIG_JSON_PAPARAZZI_03 }}
        # Telegram Niche Group IDs
        TELEGRAM_CONFIG_FASHION:     ${{ secrets.TELEGRAM_CONFIG_FASHION }}
        TELEGRAM_CONFIG_FASHION_01:  ${{ secrets.TELEGRAM_CONFIG_FASHION_01 }}
        TELEGRAM_CONFIG_FASHION_02:  ${{ secrets.TELEGRAM_CONFIG_FASHION_02 }}
        TELEGRAM_CONFIG_FASHION_03:  ${{ secrets.TELEGRAM_CONFIG_FASHION_03 }}
        TELEGRAM_CONFIG_ADULT:       ${{ secrets.TELEGRAM_CONFIG_ADULT }}
        TELEGRAM_CONFIG_ADULT_01:    ${{ secrets.TELEGRAM_CONFIG_ADULT_01 }}
        TELEGRAM_CONFIG_ADULT_02:    ${{ secrets.TELEGRAM_CONFIG_ADULT_02 }}
        TELEGRAM_CONFIG_ADULT_03:    ${{ secrets.TELEGRAM_CONFIG_ADULT_03 }}
        UPI_ID:                      ${{ secrets.UPI_ID }}
      run: |
        mkdir -p Credentials

        # Main .env
        if [ -n "$ENV_FILE_CONTENT" ]; then
          echo "$ENV_FILE_CONTENT" > Credentials/.env
        fi

        # Telegram config
        if [ -n "$TELEGRAM_CONFIG_JSON" ]; then
          echo "$TELEGRAM_CONFIG_JSON" > Credentials/telegram_config.json
        fi

        # General Fallback IG — base account
        if [ -n "$META_CONFIG_GENERAL_FALLBACK" ]; then
          mkdir -p Credentials/social_media/General_Fallback
          echo "$META_CONFIG_GENERAL_FALLBACK" > Credentials/social_media/General_Fallback/meta_config.json
          echo "Injected General_Fallback IG"
        fi

        # General Fallback IG — additional accounts (_01–_04)
        for n in 01 02 03 04; do
          VAR="META_CONFIG_JSON_${n}"
          VAL="${!VAR}"
          if [ -n "$VAL" ]; then
            mkdir -p "Credentials/social_media/General_Fallback_${n}"
            echo "$VAL" > "Credentials/social_media/General_Fallback_${n}/meta_config.json"
            echo "Injected General_Fallback_${n} IG"
          fi
        done

        # Fashion IG — base account
        if [ -n "$META_CONFIG_JSON_FASHION" ]; then
          mkdir -p Credentials/social_media/Fashion
          echo "$META_CONFIG_JSON_FASHION" > Credentials/social_media/Fashion/meta_config.json
          echo "Injected Fashion (base) IG"
        fi
        if [ -n "$CLIENT_SECRET_JSON" ]; then
          mkdir -p Credentials/social_media/Fashion
          echo "$CLIENT_SECRET_JSON" > Credentials/social_media/Fashion/client_secret.json
          echo "Injected Fashion (base) YT client_secret"
        fi
        if [ -n "$TOKEN_JSON" ]; then
          mkdir -p Credentials/social_media/Fashion
          echo "$TOKEN_JSON" > Credentials/social_media/Fashion/token.json
          echo "Injected Fashion (base) YT token"
        fi

        # Root default YT fallback
        if [ -n "$CLIENT_SECRET_JSON" ]; then
          echo "$CLIENT_SECRET_JSON" > Credentials/client_secret.json
          echo "Injected root default YT client_secret"
        fi
        if [ -n "$TOKEN_JSON" ]; then
          echo "$TOKEN_JSON" > Credentials/token.json
          echo "Injected root default YT token"
        fi

        # Fashion IG — additional accounts (_01–_04)
        for n in 01 02 03 04; do
          VAR="META_CONFIG_JSON_FASHION_${n}"; VAL="${!VAR}"
          if [ -n "$VAL" ]; then
            mkdir -p "Credentials/social_media/Fashion_${n}"
            echo "$VAL" > "Credentials/social_media/Fashion_${n}/meta_config.json"
            echo "Injected Fashion_${n} IG"
          fi
          CS_VAR="CLIENT_SECRET_JSON_${n}"; CS_VAL="${!CS_VAR}"
          if [ -n "$CS_VAL" ]; then
            mkdir -p "Credentials/social_media/Fashion_${n}"
            echo "$CS_VAL" > "Credentials/social_media/Fashion_${n}/client_secret.json"
            echo "Injected Fashion_${n} YT client_secret"
          fi
          TK_VAR="TOKEN_JSON_${n}"; TK_VAL="${!TK_VAR}"
          if [ -n "$TK_VAL" ]; then
            mkdir -p "Credentials/social_media/Fashion_${n}"
            echo "$TK_VAL" > "Credentials/social_media/Fashion_${n}/token.json"
            echo "Injected Fashion_${n} YT token"
          fi
        done

        # NSFW IG — base account
        if [ -n "$META_CONFIG_JSON_NSFW" ]; then
          mkdir -p Credentials/social_media/NSFW
          echo "$META_CONFIG_JSON_NSFW" > Credentials/social_media/NSFW/meta_config.json
          echo "Injected NSFW (base) IG"
        fi
        if [ -n "$CLIENT_SECRET_JSON_ADULT" ]; then
          mkdir -p Credentials/social_media/NSFW
          echo "$CLIENT_SECRET_JSON_ADULT" > Credentials/social_media/NSFW/client_secret.json
          echo "Injected NSFW (base) YT client_secret"
        fi
        if [ -n "$TOKEN_JSON_ADULT" ]; then
          mkdir -p Credentials/social_media/NSFW
          echo "$TOKEN_JSON_ADULT" > Credentials/social_media/NSFW/token.json
          echo "Injected NSFW (base) YT token"
        fi

        # NSFW IG — additional accounts (_01–_03)
        for n in 01 02 03; do
          VAR="META_CONFIG_JSON_NSFW_${n}"; VAL="${!VAR}"
          if [ -n "$VAL" ]; then
            mkdir -p "Credentials/social_media/NSFW_${n}"
            echo "$VAL" > "Credentials/social_media/NSFW_${n}/meta_config.json"
            echo "Injected NSFW_${n} IG"
          fi
          CS_VAR="CLIENT_SECRET_JSON_ADULT_${n}"; CS_VAL="${!CS_VAR}"
          if [ -n "$CS_VAL" ]; then
            mkdir -p "Credentials/social_media/NSFW_${n}"
            echo "$CS_VAL" > "Credentials/social_media/NSFW_${n}/client_secret.json"
            echo "Injected NSFW_${n} YT client_secret"
          fi
          TK_VAR="TOKEN_JSON_ADULT_${n}"; TK_VAL="${!TK_VAR}"
          if [ -n "$TK_VAL" ]; then
            mkdir -p "Credentials/social_media/NSFW_${n}"
            echo "$TK_VAL" > "Credentials/social_media/NSFW_${n}/token.json"
            echo "Injected NSFW_${n} YT token"
          fi
        done

        # Paparazzi IG — base account (activates when secret is added)
        if [ -n "$META_CONFIG_JSON_PAPARAZZI" ]; then
          mkdir -p Credentials/social_media/Paparazzi
          echo "$META_CONFIG_JSON_PAPARAZZI" > Credentials/social_media/Paparazzi/meta_config.json
          echo "Injected Paparazzi (base) IG"
        fi

        # Paparazzi IG — additional accounts (_01–_03)
        for n in 01 02 03; do
          VAR="META_CONFIG_JSON_PAPARAZZI_${n}"; VAL="${!VAR}"
          if [ -n "$VAL" ]; then
            mkdir -p "Credentials/social_media/Paparazzi_${n}"
            echo "$VAL" > "Credentials/social_media/Paparazzi_${n}/meta_config.json"
            echo "Injected Paparazzi_${n} IG"
          fi
        done

        # CI flags
        echo "PAPARAZZI_MODE=yes" >> Credentials/.env
        echo "AUTO_PUBLISH_ACTRESS_CLIPS=yes" >> Credentials/.env

        # Telegram Niche Group IDs — Fashion
        if [ -n "$TELEGRAM_CONFIG_FASHION" ]; then
          echo "TELEGRAM_GROUP_ID_FASHION=${TELEGRAM_CONFIG_FASHION}" >> Credentials/.env
          echo "Injected TELEGRAM_GROUP_ID_FASHION"
        fi
        for n in 01 02 03; do
          VAR="TELEGRAM_CONFIG_FASHION_${n}"; VAL="${!VAR}"
          if [ -n "$VAL" ]; then
            echo "TELEGRAM_GROUP_ID_FASHION_${n}=${VAL}" >> Credentials/.env
            echo "Injected TELEGRAM_GROUP_ID_FASHION_${n}"
          fi
        done

        # Telegram Niche Group IDs — NSFW/Adult
        if [ -n "$TELEGRAM_CONFIG_ADULT" ]; then
          echo "TELEGRAM_GROUP_ID_NSFW=${TELEGRAM_CONFIG_ADULT}" >> Credentials/.env
          echo "Injected TELEGRAM_GROUP_ID_NSFW"
        fi
        for n in 01 02 03; do
          VAR="TELEGRAM_CONFIG_ADULT_${n}"; VAL="${!VAR}"
          if [ -n "$VAL" ]; then
            echo "TELEGRAM_GROUP_ID_NSFW_${n}=${VAL}" >> Credentials/.env
            echo "Injected TELEGRAM_GROUP_ID_NSFW_${n}"
          fi
        done

    # ── 6. Run AMTCE Engine ───────────────────────────────────────────────────
    # main.py with no args → start_telegram_bot_service() → blocks on run_polling()
    # The async scheduler inside the bot fires at SCRAPING_AUTO_INPUT_TIMES slots,
    # harvests reels, renders them via Phase 1→2→3, and pushes to Telegram for review.
    # GitHub Actions kills the process cleanly after timeout-minutes: 360.
    # Manual workflow_dispatch runs are NEVER skipped — only scheduled crons check the lock.
    - name: Run AMTCE Engine
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }}
        DISPATCH_MODE: ${{ github.event.inputs.mode || 'auto' }}
        DISPATCH_PLATFORM: ${{ github.event.inputs.platform || 'all_available' }}
        DISPATCH_TARGET_ACCOUNTS: ${{ github.event.inputs.target_accounts || '' }}
        DISPATCH_TARGET_URL: ${{ github.event.inputs.target_url || '' }}
      run: |
        # ── Scheduled-run fast-exit guard ────────────────────────────────────
        # If this is a cron/schedule trigger AND a valid bot_lock exists in the
        # committed repo (meaning a persistent 6h session is already running),
        # exit immediately to avoid a duplicate bot instance.
        # Manual workflow_dispatch runs are NEVER skipped.
        if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -f "The_json/bot_lock.json" ]; then
          LOCK_EXPIRES=$(python3 -c "
        import json, sys
        try:
            data = json.load(open('The_json/bot_lock.json'))
            print(data.get('expires_at', 0))
        except Exception:
            print(0)
        " 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ "$LOCK_EXPIRES" -gt "$NOW" ]; then
            MINS_LEFT=$(( (LOCK_EXPIRES - NOW) / 60 ))
            echo "🔒 [CI GUARD] Active bot lock found (~${MINS_LEFT}m remaining). Skipping duplicate cron run."
            exit 0
          fi
        fi
        # ── Write bot_lock.json so overlapping crons self-skip ────────────────
        mkdir -p The_json
        python3 -c "
        import json, time, os
        lock = {'started_at': int(time.time()), 'expires_at': int(time.time()) + 21300}
        with open('The_json/bot_lock.json', 'w') as f:
            json.dump(lock, f)
        print('🔐 Bot lock written (expires in ~355 min)')
        "
        # ─────────────────────────────────────────────────────────────────────
        PLATFORM_TO_USE="$DISPATCH_PLATFORM"
        if [ "$PLATFORM_TO_USE" = "all_available" ] || [ -z "$PLATFORM_TO_USE" ]; then
          PLATFORM_TO_USE="instagram"
        fi

        if [ "$DISPATCH_MODE" = "manual" ] || [ -n "$DISPATCH_TARGET_URL" ] || [ -n "$DISPATCH_TARGET_ACCOUNTS" ]; then
          if [ -n "$DISPATCH_TARGET_URL" ]; then
            echo "🎯 Executing manual targeted run for URL: $DISPATCH_TARGET_URL"
            python main.py --mode manual --url "$DISPATCH_TARGET_URL"
          elif [ -n "$DISPATCH_TARGET_ACCOUNTS" ]; then
            echo "🎯 Executing manual targeted run for account(s): $DISPATCH_TARGET_ACCOUNTS (platform: $PLATFORM_TO_USE)"
            python main.py --mode auto --target-accounts "$DISPATCH_TARGET_ACCOUNTS"
          else
            echo "🤖 Executing daemon scheduler mode..."
            python main.py
          fi
        else
          echo "🤖 Executing daemon scheduler mode..."
          python main.py
        fi

    # ── 7. Commit State Back to Repo ─────────────────────────────────────────
    # Runs even if the engine step times out or crashes.
    # Persists dedup ledger, audio pool, hook rotation, and publish queue so the
    # next session picks up exactly where this one left off.
    - name: Commit Dedup State to Git
      if: always()
      continue-on-error: true
      run: |
        set +e
        git config user.name  "AMTCE Bot"
        git config user.email "amtce-bot@users.noreply.github.com"

        # Wipe leftover clip files that weren't cleaned up during the session
        find downloads/ -name "*.mp4" -type f -delete 2>/dev/null || true
        find downloads/ -empty -type d -delete 2>/dev/null || true

        # Stage state files
        git add -f Actress_Modules/actress_ledger.json          || true
        git add -f Actress_Modules/published_registry.json      || true
        git add -f Actress_Modules/failed_uploads.json          || true
        git add -f Actress_Modules/apify_cursor.json            || true
        git add -f Actress_Modules/account_daily_limits.json    || true
        git add -f publish_queue.json                           || true
        git add -f The_json/telegram_router_state.json          || true
        git add -f The_json/music_usage.json                    || true
        git add -f The_json/auction_schedule.json               || true
        git add -f The_json/bot_lock.json                       || true
        git add -f Original_audio/pool_metadata.json            || true
        git add -f Intelligence_Data/salesman_state.json        || true
        git add -f The_json/message_ledger.json                 || true
        git add -f The_json/auction_ledger.json                 || true
        # Hook rotation — prevents same CTA hook repeating every run
        git add -f The_json/hook_rotation.json                  || true
        git add -f The_json/viral_hook_memory.json              || true

        # Audio pool — commit surviving clips so the pool isn't empty next session
        for f in Original_audio/active/*.mp3  \
                  Original_audio/active/*.wav  \
                  Original_audio/cooldown/*.mp3 \
                  Original_audio/cooldown/*.wav \
                  Original_audio/beats/*.npz; do
          [ -f "$f" ] || continue
          size=$(stat -c%s "$f" 2>/dev/null || echo 0)
          if [ "$size" -le 10485760 ]; then
            git add -f "$f" && echo "Pool: staged $f (${size}B)" || true
          else
            echo "Pool: skipped $f — too large (${size}B > 10MB)"
          fi
        done

        if git diff --cached --quiet; then
          echo "No state changes to commit."
        else
          git commit -m "ci: update dedup ledger, audio pool + queue [skip ci]"
          git fetch origin main
          git rebase origin/main --strategy-option=theirs || git rebase --abort
          git push origin HEAD:main || echo "Push skipped (concurrent run or auth failure)"
          echo "State committed."
        fi
        exit 0
